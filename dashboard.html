<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แดชบอร์ดสรุปยอดสต็อก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="p-2 md:p-6 text-gray-800 pb-10">
    <div class="max-w-5xl mx-auto space-y-4">
        
        <!-- แถบควบคุมด้านบน -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 sticky top-2 z-10">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-lg md:text-xl font-bold text-indigo-700 flex items-center gap-2">📊 แดชบอร์ดสรุปยอด</h1>
                <span id="sync-status" class="text-[10px] md:text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">กำลังเชื่อมต่อ...</span>
            </div>
            
            <!-- เลือกวันที่ (สร้างอัตโนมัติจากตัวแปร DATES) -->
            <select id="date-select" onchange="window.renderUI()" class="w-full bg-indigo-50 border border-indigo-100 text-indigo-900 p-2.5 rounded-xl font-bold text-sm focus:outline-none mb-3"></select>

            <!-- กล่องสรุปยอดรวมทั้งหมดของงาน (Grand Total) -->
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-blue-50 border border-blue-100 p-2 md:p-3 rounded-xl text-center shadow-sm">
                    <span class="text-xs text-blue-500 font-bold block mb-1">ออกรวมทั้งหมด</span>
                    <span id="grand-total-sold" class="text-2xl md:text-3xl font-black text-blue-700">0</span>
                </div>
                <div class="bg-rose-50 border border-rose-100 p-2 md:p-3 rounded-xl text-center shadow-sm">
                    <span class="text-xs text-rose-500 font-bold block mb-1">ของเหลือรวมทั้งหมด</span>
                    <span id="grand-total-remain" class="text-2xl md:text-3xl font-black text-rose-700">0</span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-cyan-600 text-white px-4 py-2 font-bold text-sm">🏆 หมวดรางวัลปกติ</div>
            <div id="normal-prizes" class="divide-y divide-gray-100"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-emerald-600 text-white px-4 py-2 font-bold text-sm">✨ หมวดรางวัลพิเศษ</div>
            <div id="special-prizes" class="divide-y divide-gray-100"></div>
        </div>
    </div>

    <!-- สคริปต์ดึงข้อมูล Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnc4kMj99ugsc19VgIF5zecbdAEwMUJVs",
            authDomain: "check-storck.firebaseapp.com",
            projectId: "check-storck",
            storageBucket: "check-storck.firebasestorage.app",
            messagingSenderId: "258019752916",
            appId: "1:258019752916:web:8fe3e6140ea781ced93441"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // กำหนดวันที่ 2 วัน (ต้องตั้งชื่อให้ตรงกับตัวแปร DATES ในไฟล์ index.html)
        const DATES = ["วันที่ 1", "วันที่ 2"];

        const prizes = [
             id: 'A', name: 'ทิชชู่', total: 576 }, { id: 'B', name: 'ขนม', total: 96 }, { id: 'C', name: 'ช้างเล็ก', total: 60 },
            { id: 'D', name: 'ช้างใหญ่', total: 57 }, { id: 'E', name: 'สกุชชี่เล็ก', total: 108 }, { id: 'F', name: 'พวงกุญแจเล็ก', total: 60 },
            { id: 'G', name: 'พวงกุญแจใหญ่', total: 14 },
            { id: '000', name: 'เต่า', total: 4 }, { id: '111', name: 'เต่า', total: 24 }, { id: '222', name: 'ตุ๊กตาเป็ด', total: 6 }, { id: '333', name: 'สกุชชี่ซาลาเปา', total: 24 },
            { id: '444', name: 'สกุชชี่ขนม', total: 3 }, { id: '555', name: 'สกุชชี่กล่องเทา', total: 1 },
            { id: 'EDU', name: 'ออมสิน', total: 1 }, { id: 'VRU', name: 'ที่นอน', total: 4 }, { id: '2026', name: 'ตุ๊กตาใหญ่', total: 1 }
        ];

        // สร้างตัวเลือกวันที่ใน Dropdown
        document.getElementById('date-select').innerHTML = DATES.map(d => `<option value="${d}">ดูยอดสะสมถึง: ${d}</option>`).join('');

        window.remoteData = {};
        const statusEl = document.getElementById('sync-status');

        signInAnonymously(auth).then(() => {
            let loadedCount = 0;
            DATES.forEach(d => {
                const docId = d.replace(/\//g, '-');
                onSnapshot(doc(db, 'daily_stocks', docId), (snap) => {
                    window.remoteData[d] = snap.data() || {};
                    loadedCount++;
                    if (loadedCount > 0) {
                        statusEl.innerText = "ออนไลน์ 🟢 (อัปเดตเรียลไทม์)";
                        statusEl.className = "text-[10px] md:text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded";
                    }
                    window.renderUI();
                });
            });
        });

        window.renderUI = () => {
            const selectedDate = document.getElementById('date-select').value;
            
            // ตัวแปรสำหรับเก็บยอดรวมทั้งหมด
            let grandTotalSold = 0;
            let grandTotalRemain = 0;

            const generateHTML = (list) => {
                let html = `
                    <div class="hidden sm:flex text-[10px] md:text-xs font-bold text-gray-500 bg-gray-50 px-3 py-2 border-b text-center">
                        <div class="w-2/5 text-left">รหัส / รายการ</div>
                        <div class="w-1/5">ออกวันนี้</div>
                        <div class="w-1/5 text-indigo-600">รวมสะสม</div>
                        <div class="w-1/5 text-red-600">คงเหลือ</div>
                    </div>
                `;

                html += list.map(p => {
                    const dayData = window.remoteData[selectedDate] || {};
                    const soldToday = Number(dayData[p.id] || 0);

                    // คำนวณยอดสะสมถึงวันที่เลือก
                    let totalCumulativeSold = 0;
                    for (let d of DATES) {
                        const dData = window.remoteData[d] || {};
                        totalCumulativeSold += Number(dData[p.id] || 0);
                        if (d === selectedDate) break; 
                    }

                    const remain = p.total - totalCumulativeSold;

                    // บวกเข้ายอด Grand Total
                    grandTotalSold += totalCumulativeSold;
                    grandTotalRemain += remain;

                    return `
                        <div class="flex flex-col sm:flex-row px-3 py-3 border-b hover:bg-gray-50 text-sm items-center">
                            <div class="w-full sm:w-2/5 flex items-center gap-2 mb-3 sm:mb-0">
                                <span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded">${p.id}</span>
                                <div>
                                    <span class="font-bold text-gray-800">${p.name}</span>
                                    <span class="text-[10px] text-gray-500 block mt-0.5">ตั้งต้น: ${p.total}</span>
                                </div>
                            </div>
                            
                            <div class="w-full sm:w-3/5 grid grid-cols-3 gap-2 items-center text-center text-xs sm:text-sm">
                                <div class="bg-gray-50 px-2 py-1.5 rounded-lg border border-gray-200">
                                    <span class="sm:hidden text-gray-500 text-[10px] block mb-0.5">ออกวันนี้</span>
                                    <span class="font-bold text-gray-700 text-base">${soldToday}</span>
                                </div>
                                
                                <div class="bg-indigo-50 px-2 py-1.5 rounded-lg border border-indigo-100">
                                    <span class="sm:hidden text-indigo-500 text-[10px] block mb-0.5">รวมสะสม</span>
                                    <span class="font-bold text-indigo-700 text-base">${totalCumulativeSold}</span>
                                </div>

                                <div class="bg-red-50 px-2 py-1.5 rounded-lg border border-red-100">
                                    <span class="sm:hidden text-red-500 text-[10px] block mb-0.5">เหลือ</span>
                                    <span class="font-bold text-lg ${remain <= 0 ? 'text-red-600' : 'text-red-500'}">${remain}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                return html;
            };

            // วาดตาราง
            document.getElementById('normal-prizes').innerHTML = generateHTML(prizes.slice(0, 8));
            document.getElementById('special-prizes').innerHTML = generateHTML(prizes.slice(8));

            // อัปเดตตัวเลข Grand Total ขึ้นหน้าจอ
            document.getElementById('grand-total-sold').innerText = grandTotalSold;
            document.getElementById('grand-total-remain').innerText = grandTotalRemain;
        };
    </script>
</body>
</html>
